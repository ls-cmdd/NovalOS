name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Format, test, and release build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install nightly Rust and BIOS/UEFI targets
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi

      - name: Install NASM
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

      - name: Run kernel tests
        run: cargo +nightly test -p kernel --bin kernel -j 1

      - name: Build release images
        run: cargo +nightly build --release --locked -j 1
